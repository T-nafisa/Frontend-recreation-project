<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soupy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header  Section -->
<header class="hero-section">
    <div class="top-bar">
        <div class="social-icons">
            <a href="https://www.google.com">
                <img src="icons/facebook-icon.svg" alt="Facebook icon">
            </a>
            <a href="https://www.google.com">
                <img src="icons/insta-icon.svg" alt="Instagram icon">
            </a>
            <a href="https://www.google.com">
                <img src="icons/yt-icon.svg" alt="YouTube icon">
            </a>
        </div>

        <div class="brand-area">
            <h1 class="logo">Soupy</h1>

            <nav class="navbar">
                <a href="https://www.google.com">Shop</a>
                <a href="https://www.google.com">Journal</a>
                <a href="https://www.google.com">About</a>
                <a href="https://www.google.com">Contact</a>
            </nav>
        </div>

        <div class="cart-area">
            <span class="cart-count">0</span>
            <img src="icons/basket-icon.svg" alt="Basket icon">
        </div>
    </div>

    <div class="hero-content">
        <div class="hero-text">
            <h2>Soup for every<br>body.</h2>
            <a href="https://www.google.com" class="shop-btn">Shop now</a>
        </div>

        <div class="hero-image">
            <img src="images/main-img.jpeg" alt="Handmade soap displayed on wooden blocks">
        </div>
    </div>
</header>

<!-- Product Section -->
<main>
    <section class="shop-section">
        <h2>Shop our soaps</h2>

        <div class="products">

            <!-- Product 1 -->
            <article class="product-card">
                <img src="images/eucalyptus-soup.jpg" alt="Eucalyptus and Citrus soap">

                <h3>Eucalyptus and Citrus</h3>
                <p class="price">$12.00</p>

                <div class="product-actions">
                    <div class="quantity-box">
                        <button class="minus-btn" type="button">-</button>
                        <span class="quantity">1</span>
                        <button class="plus-btn" type="button">+</button>
                    </div>

                    <button class="cart-btn" type="button">Add to cart</button>
                </div>
            </article>

            <!-- Product 2 -->
            <article class="product-card">
                <img src="images/sage-soap.jpg" alt="Sage and Cedarwood soap">

                <h3>Sage and Cedarwood</h3>
                <p class="price">$12.00</p>

                <div class="product-actions">
                    <div class="quantity-box">
                        <button class="minus-btn" type="button">-</button>
                        <span class="quantity">1</span>
                        <button class="plus-btn" type="button">+</button>
                    </div>

                    <button class="cart-btn" type="button">Add to cart</button>
                </div>
            </article>

            <!-- Product 3 -->
            <article class="product-card">
                <img src="images/sandalwood-soup.jpg" alt="Sandalwood and Rose soap">

                <h3>Sandalwood and Rose</h3>
                <p class="price">$12.00</p>

                <div class="product-actions">
                    <div class="quantity-box">
                        <button class="minus-btn" type="button">-</button>
                        <span class="quantity">1</span>
                        <button class="plus-btn" type="button">+</button>
                    </div>

                    <button class="cart-btn" type="button">Add to cart</button>
                </div>
            </article>

        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
